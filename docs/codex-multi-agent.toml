# Codex helper settings that enforce the agent-efficiency rules (docs/agent-efficiency.md).
# scripts/install-efficiency-rules.sh copies this table into ~/.codex/config.toml.
# A wait ends early when a helper reports or the user types, so the long minimum only
# removes short polling. Codex caps every wait at one hour.
[features.multi_agent_v2]
min_wait_timeout_ms = 1800000
default_wait_timeout_ms = 1800000
max_wait_timeout_ms = 3600000
subagent_developer_instructions = '''
You are a helper started by a coordinating agent. Work only on the task in your brief and
the files it lets you own. Send no progress or status messages to the coordinator: do not
call send_message to it while you work. Ask it only when you are truly blocked and cannot
continue. When the task is done, end with one final answer of at most 10 lines: the commit,
the check results, and open problems. Filter command output, build and test once per commit,
and take at most three screenshots.
'''
