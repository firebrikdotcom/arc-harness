name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node if package.json exists
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Enable Corepack for pnpm/yarn
        if: ${{ hashFiles('package.json') != '' }}
        run: corepack enable

      # Exactly the packages in .harness-required-tools, the list scripts/init.sh
      # checks locally. --no-upgrade keeps tools the runner already has at their
      # current versions. tests/required-tools.sh fails on any other install here.
      - name: Install required tools
        run: |
          packages=$(scripts/required-tools.sh packages)
          if [ -n "$packages" ]; then
            sudo apt-get update
            sudo apt-get install --yes --no-upgrade $packages
          fi

      - name: Bootstrap
        run: scripts/init.sh --yes

      # The Rust services' tests otherwise rebuild every crate on each run.
      - name: Cache Cargo builds
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/*/target
          key: cargo-${{ runner.os }}-${{ hashFiles('services/*/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Verify
        run: scripts/verify.sh
