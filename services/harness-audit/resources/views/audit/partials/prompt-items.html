{% for prompt in prompt_page %}<li class="row-item prompt-row" id="prompt-{{ prompt.prompt_id }}"><details><summary class="row-summary"><span class="row-index">{{ prompt.number }}</span><span class="row-main"><span class="row-preview">{{ prompt.preview }}</span><span class="row-times"><time data-client-time="{{ prompt.occurred_at }}">—</time></span></span></summary><p class="prompt-text">{{ prompt.text }}</p></details></li>{% endfor %}
