<div class="list-more" data-more="{{ more.list }}">{% if more.total == 0 %}<p class="muted">No matching {{ more.noun }}.</p>{% else %}<span class="muted" aria-live="polite">Showing {{ more.shown }} of {{ more.total }} {{ more.noun }}</span>{% if more.shown < more.total %}<a class="button" href="{{ more.url }}" data-more-src="{{ more.src }}">Show {{ more.step }} more</a>{% endif %}{% endif %}</div>
