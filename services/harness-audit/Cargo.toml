[package]
name = "harness-audit"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-session = "0.10"
actix-web = "4"
anyhow = "1"
arc-core = "0.8.5"
arc-web = "0.8.5"
async-trait = "0.1"
chrono = "0.4"
chrono-tz = "0.9"
diesel = { version = "2.2", features = ["sqlite", "r2d2"] }
diesel_migrations = "2.2"
dotenv = "0.15"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tera = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
