[package]
name = "harness-signals"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pulls errors and warnings from tracked projects' observability tools and maps them onto architecture board cards."

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
tempfile = "3"
